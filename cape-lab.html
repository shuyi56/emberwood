<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Emberwood cape bench</title>
<link rel="stylesheet" href="./src/cape-lab/styles.css">
</head>
<body>
<main>
  <canvas id="view" aria-label="The cape on a stand-in body"></canvas>
  <aside class="panel">
    <h1>Cape bench</h1>
    <p>The Warden's cape on spring bones, on a stand-in with her joints. The solver and settings are the game's.</p>
    <div class="row">
      <label>Motion <select id="scenario"></select></label>
      <label>Camera <select id="camview"></select></label>
    </div>
    <div class="row">
      <label>Body <select id="bodysel"></select></label>
    </div>
    <div class="row">
      <label>Chains <select id="columns"></select></label>
      <label>Rows <select id="rows"></select></label>
    </div>
    <div class="row checks">
      <label><input type="checkbox" id="springsOn"> Springs</label>
      <label><input type="checkbox" id="showBody"> Body</label>
      <label><input type="checkbox" id="showColliders"> Colliders</label>
      <label><input type="checkbox" id="showBones"> Bones</label>
    </div>
    <div id="sliders"></div>
    <div class="row">
      <button type="button" id="restart">Restart</button>
      <button type="button" id="copy">Copy settings</button>
    </div>
    <p id="readout" class="readout"></p>
    <p id="status" class="readout" role="status"></p>
  </aside>
</main>
<script type="module" src="./src/cape-lab/main.js"></script>
</body>
</html>
