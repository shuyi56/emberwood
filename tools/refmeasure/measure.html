<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reference Measure</title>
<style>
:root { --bg:#16181c; --panel:#20232a; --ink:#e6e6e6; --dim:#9aa0a8; --acc:#3fb6ff; --pt:#ff3cc8; --seg:#50ff78; --plumb:#ff2828; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:13px/1.4 system-ui, sans-serif; display:flex; height:100vh; }
#side { width:340px; min-width:300px; overflow:auto; background:var(--panel); padding:10px 12px; }
#stage { flex:1; position:relative; overflow:hidden; cursor:crosshair; }
canvas { position:absolute; left:0; top:0; }
h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); margin:14px 0 6px; }
input, select, button { background:#2b2f37; color:var(--ink); border:1px solid #3a3f49; border-radius:4px; padding:3px 6px; font:inherit; }
button { cursor:pointer; } button:hover { border-color:var(--acc); }
.row { display:flex; gap:4px; flex-wrap:wrap; align-items:center; margin:3px 0; }
table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
td { padding:1px 4px; border-bottom:1px solid #2c3038; } td.n { text-align:right; }
.x { color:#ff7a7a; cursor:pointer; padding:0 4px; }
#probe { color:var(--acc); min-height:2.8em; white-space:pre-wrap; font-family:ui-monospace, monospace; font-size:12px; }
.hint { color:var(--dim); font-size:12px; }
@media (max-width:700px) { body { flex-direction:column; } #side { width:100%; height:45vh; } }
</style>
</head>
<body>
<div id="side">
  <div class="row"><input type="file" id="fImg" accept="image/*" title="image"></div>
  <div class="row"><label class="hint">sheet&nbsp;</label><input type="file" id="fJson" accept=".json"><button id="bSave">Save sheet</button></div>
  <div class="hint">Click to place the current landmark, drag a point to move it, Alt-drag or wheel to pan and zoom. Shift-click two points, then two more, to probe.</div>

  <h2>Landmark</h2>
  <div class="row"><input id="iName" list="names" placeholder="name, e.g. shoulder_l" style="flex:1"><datalist id="names"></datalist></div>
  <div class="row"><label><input type="checkbox" id="cGrid" checked> unit grid</label>
    <label>sub <input id="iSub" type="number" value="4" min="1" max="10" style="width:46px"></label>
    <label><input type="checkbox" id="cLevels" checked> levels</label></div>

  <h2>Unit and plumb</h2>
  <div class="row"><input id="uName" value="head" style="width:70px"> = <select id="uA"></select>→<select id="uB"></select>
    <select id="uAxis"><option>len</option><option>x</option><option>y</option></select></div>
  <div class="row">plumb through <select id="plumb"></select></div>

  <h2>Segments</h2>
  <div class="row"><input id="sName" placeholder="name" style="width:90px"><select id="sA"></select><select id="sB"></select>
    <select id="sAxis"><option>len</option><option>x</option><option>y</option></select><button id="bSeg">add</button></div>
  <table id="tSeg"></table>

  <h2>Ratios</h2>
  <div class="row"><input id="rName" placeholder="name" style="width:90px"><select id="rP"></select>/<select id="rQ"></select><button id="bRat">add</button></div>
  <table id="tRat"></table>

  <h2>Probe</h2>
  <div id="probe"></div>

  <h2>Landmarks (units from plumb)</h2>
  <table id="tPts"></table>
</div>
<div id="stage"><canvas id="cv"></canvas></div>
<script>
// Same sheet format as refmeasure.py, so a sheet saved here reports and compares headless.
const NAMES = ["head_top","brow","nose_base","chin","neck_l","neck_r","neck_front","neck_back","jugular_notch","c7",
 "shoulder_l","shoulder_r","armpit_l","armpit_r","bust_l","bust_r","waist_l","waist_r","waist_front","hip_l","hip_r",
 "elbow_l","elbow_r","wrist_l","wrist_r","knee_l","knee_r","ankle_l","ankle_r","floor",
 "collar_top","collar_point_l","collar_point_r","gorge_l","gorge_r","notch_l","notch_r","lapel_point_l","lapel_point_r",
 "lapel_outer_l","lapel_outer_r","roll_top_l","roll_top_r","break_point","top_button","bottom_button","hem_front",
 "hem_side_l","hem_side_r","sleeve_cap_l","sleeve_cap_r","cuff_l","cuff_r"];
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d"), stage = $("stage");
let img = null, S = blank(), view = {k:1, x:0, y:0}, drag = null, probePts = [];
function blank(){ return {version:1, image:"", size:[0,0], camera:{view:"",projection:"photo",note:""}, unit:null, plumb:null, landmarks:{}, segments:{}, ratios:{}}; }
$("names").innerHTML = NAMES.map(n=>`<option value="${n}">`).join("");

function span(a,b,axis){ const p=S.landmarks[a], q=S.landmarks[b]; if(!p||!q) return NaN;
  return axis==="x"?Math.abs(q[0]-p[0]) : axis==="y"?Math.abs(q[1]-p[1]) : Math.hypot(q[0]-p[0],q[1]-p[1]); }
function segSpec(v){ return Array.isArray(v) ? {a:v[0],b:v[1],axis:v[2]||"len"} : {a:v.a,b:v.b,axis:v.axis||"len"}; }
function unitPx(){ const u=S.unit; return u ? span(u.a,u.b,u.axis||"len") : NaN; }
function lean(a,b){ let [x0,y0]=S.landmarks[a],[x1,y1]=S.landmarks[b]; if(y1<y0){[x0,y0,x1,y1]=[x1,y1,x0,y0];} return Math.atan2(x1-x0,y1-y0)*180/Math.PI; }
const f3 = v => isFinite(v) ? v.toFixed(3) : "–";

function fit(){ if(!img) return; const r=stage.getBoundingClientRect(); cv.width=r.width; cv.height=r.height;
  view.k=Math.min(r.width/img.width, r.height/img.height); view.x=(r.width-img.width*view.k)/2; view.y=(r.height-img.height*view.k)/2; draw(); }
const toScr = (x,y) => [view.x+x*view.k, view.y+y*view.k];
const toImg = (X,Y) => [(X-view.x)/view.k, (Y-view.y)/view.k];

function draw(){
  const r=stage.getBoundingClientRect(); if(cv.width!==r.width||cv.height!==r.height){cv.width=r.width;cv.height=r.height;}
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); if(!img) return;
  ctx.drawImage(img, view.x, view.y, img.width*view.k, img.height*view.k);
  const u=unitPx(), org=S.plumb||(S.unit&&S.unit.a), O=org&&S.landmarks[org];
  if($("cGrid").checked && isFinite(u) && u>0 && O){
    const sub=+$("iSub").value||4, st=u/sub;
    for(let k=Math.floor(-O[0]/st); k<=Math.ceil((img.width-O[0])/st); k++){ const [X]=toScr(O[0]+k*st,0);
      ctx.strokeStyle=k%sub===0?"rgba(63,182,255,.6)":"rgba(63,182,255,.2)"; ctx.beginPath(); ctx.moveTo(X,0); ctx.lineTo(X,cv.height); ctx.stroke(); }
    for(let k=Math.floor(-O[1]/st); k<=Math.ceil((img.height-O[1])/st); k++){ const [,Y]=toScr(0,O[1]+k*st);
      ctx.strokeStyle=k%sub===0?"rgba(63,182,255,.6)":"rgba(63,182,255,.2)"; ctx.beginPath(); ctx.moveTo(0,Y); ctx.lineTo(cv.width,Y); ctx.stroke();
      if(k%sub===0){ ctx.fillStyle="#3fb6ff"; ctx.fillText((k/sub>0?"+":"")+k/sub, 4, Y-3); } }
  }
  if(O){ const [X]=toScr(O[0],0); ctx.strokeStyle="#ff2828"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(X,0); ctx.lineTo(X,cv.height); ctx.stroke(); ctx.lineWidth=1; }
  if($("cLevels").checked) for(const [n,[x,y]] of Object.entries(S.landmarks)){ const [,Y]=toScr(x,y);
    ctx.strokeStyle="rgba(255,220,0,.3)"; ctx.beginPath(); ctx.moveTo(0,Y); ctx.lineTo(cv.width,Y); ctx.stroke(); }
  ctx.font="12px system-ui";
  for(const [n,v] of Object.entries(S.segments)){ const s=segSpec(v), p=S.landmarks[s.a], q=S.landmarks[s.b]; if(!p||!q) continue;
    const q2 = s.axis==="x"?[q[0],p[1]] : s.axis==="y"?[p[0],q[1]] : q; const [ax,ay]=toScr(...p),[bx,by]=toScr(...q2);
    ctx.strokeStyle="#50ff78"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); ctx.lineWidth=1;
    ctx.fillStyle="#50ff78"; ctx.fillText(n,(ax+bx)/2+4,(ay+by)/2-4); }
  probePts.forEach((n,i)=>{ if(i%2) { const [ax,ay]=toScr(...S.landmarks[probePts[i-1]]),[bx,by]=toScr(...S.landmarks[n]);
    ctx.setLineDash([5,4]); ctx.strokeStyle="#3fb6ff"; ctx.beginPath(); ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke(); ctx.setLineDash([]);} });
  for(const [n,[x,y]] of Object.entries(S.landmarks)){ const [X,Y]=toScr(x,y);
    ctx.strokeStyle=probePts.includes(n)?"#3fb6ff":"#ff3cc8"; ctx.beginPath(); ctx.arc(X,Y,5,0,7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(X-9,Y); ctx.lineTo(X+9,Y); ctx.moveTo(X,Y-9); ctx.lineTo(X,Y+9); ctx.stroke();
    ctx.lineWidth=3; ctx.strokeStyle="#000"; ctx.strokeText(n,X+8,Y-8); ctx.lineWidth=1; ctx.fillStyle="#fff"; ctx.fillText(n,X+8,Y-8); }
}

function opts(sel, keys, cur){ sel.innerHTML=keys.map(k=>`<option${k===cur?" selected":""}>${k}</option>`).join(""); }
function refresh(){
  const L=Object.keys(S.landmarks).sort(), G=Object.keys(S.segments).sort();
  const keep=id=>$(id).value; const [ua,ub,pl,sa,sb,rp,rq]=["uA","uB","plumb","sA","sB","rP","rQ"].map(keep);
  opts($("uA"),L,S.unit?S.unit.a:ua); opts($("uB"),L,S.unit?S.unit.b:ub); opts($("plumb"),["",...L],S.plumb||pl);
  opts($("sA"),L,sa); opts($("sB"),L,sb); opts($("rP"),G,rp); opts($("rQ"),G,rq);
  if(S.unit){ $("uName").value=S.unit.name||"unit"; $("uAxis").value=S.unit.axis||"len"; }
  const u=unitPx();
  $("tSeg").innerHTML=G.map(n=>{const s=segSpec(S.segments[n]); const d=span(s.a,s.b,s.axis);
    return `<tr><td>${n}</td><td class="n">${f3(d/u)}</td><td class="hint">${s.axis}${s.axis==="len"&&isFinite(d)?" "+lean(s.a,s.b).toFixed(1)+"°":""}</td><td class="x" data-seg="${n}">×</td></tr>`}).join("");
  $("tRat").innerHTML=Object.entries(S.ratios).map(([n,[p,q]])=>{const a=segSpec(S.segments[p]||[]),b=segSpec(S.segments[q]||[]);
    return `<tr><td>${n}</td><td class="n">${f3(span(a.a,a.b,a.axis)/span(b.a,b.b,b.axis))}</td><td class="hint">${p}/${q}</td><td class="x" data-rat="${n}">×</td></tr>`}).join("");
  const org=S.plumb||(S.unit&&S.unit.a), O=org&&S.landmarks[org];
  $("tPts").innerHTML=L.map(n=>{const [x,y]=S.landmarks[n]; return `<tr><td>${n}</td><td class="n">${O&&isFinite(u)?f3((x-O[0])/u):x.toFixed(0)}</td><td class="n">${O&&isFinite(u)?f3((y-O[1])/u):y.toFixed(0)}</td><td class="x" data-pt="${n}">×</td></tr>`}).join("");
  doProbe(); draw();
}
function doProbe(){
  const u=unitPx(), k=isFinite(u)?u:1, un=isFinite(u)?(S.unit.name||"unit")+"s":"px", lines=[], r=[];
  for(let i=0;i+1<probePts.length;i+=2){ const a=probePts[i], b=probePts[i+1], [x0,y0]=S.landmarks[a],[x1,y1]=S.landmarks[b];
    const v=[Math.hypot(x1-x0,y1-y0),Math.abs(x1-x0),Math.abs(y1-y0)]; r.push(v);
    lines.push(`${a}→${b}: ${f3(v[0]/k)} ${un}  dx ${f3((x1-x0)/k)} dy ${f3((y1-y0)/k)}  ${lean(a,b).toFixed(1)}°`); }
  if(r.length===2) lines.push(`ratio  len ${f3(r[0][0]/r[1][0])}  x ${f3(r[0][1]/r[1][1])}  y ${f3(r[0][2]/r[1][2])}`);
  $("probe").textContent=lines.join("\n")||"shift-click points to probe";
}
function hit(X,Y){ for(const [n,[x,y]] of Object.entries(S.landmarks)){ const [px,py]=toScr(x,y); if(Math.hypot(px-X,py-Y)<9) return n; } return null; }
function nextName(){ const cur=$("iName").value; const i=NAMES.indexOf(cur);
  if(i>=0){ for(let j=i+1;j<NAMES.length;j++) if(!S.landmarks[NAMES[j]]) { $("iName").value=NAMES[j]; return; } } $("iName").select(); }

cv.addEventListener("mousedown", e=>{ if(!img) return; const X=e.offsetX, Y=e.offsetY, h=hit(X,Y);
  if(e.altKey||e.button===1){ drag={pan:true,X,Y,vx:view.x,vy:view.y}; return; }
  if(e.shiftKey){ if(h){ if(probePts.length>=4) probePts=[]; probePts.push(h); refresh(); } return; }
  if(h){ drag={pt:h}; return; }
  const n=$("iName").value.trim(); if(!n){ $("iName").focus(); return; }
  S.landmarks[n]=toImg(X,Y).map(v=>Math.round(v*10)/10); nextName(); refresh(); });
window.addEventListener("mousemove", e=>{ if(!drag) return; const r=cv.getBoundingClientRect(), X=e.clientX-r.left, Y=e.clientY-r.top;
  if(drag.pan){ view.x=drag.vx+X-drag.X; view.y=drag.vy+Y-drag.Y; draw(); }
  else { S.landmarks[drag.pt]=toImg(X,Y).map(v=>Math.round(v*10)/10); refresh(); } });
window.addEventListener("mouseup", ()=>drag=null);
cv.addEventListener("wheel", e=>{ e.preventDefault(); const f=Math.exp(-e.deltaY*0.0015), X=e.offsetX, Y=e.offsetY;
  view.x=X-(X-view.x)*f; view.y=Y-(Y-view.y)*f; view.k*=f; draw(); }, {passive:false});
window.addEventListener("resize", draw);

["uA","uB","uAxis","uName"].forEach(id=>$(id).addEventListener("change", ()=>{ if($("uA").value&&$("uB").value)
  S.unit={name:$("uName").value||"unit", a:$("uA").value, b:$("uB").value, axis:$("uAxis").value}; refresh(); }));
$("plumb").addEventListener("change", ()=>{ S.plumb=$("plumb").value||null; refresh(); });
["cGrid","cLevels","iSub"].forEach(id=>$(id).addEventListener("change", draw));
$("bSeg").onclick=()=>{ const n=$("sName").value.trim(); if(!n) return; S.segments[n]={a:$("sA").value,b:$("sB").value,axis:$("sAxis").value}; $("sName").value=""; refresh(); };
$("bRat").onclick=()=>{ const n=$("rName").value.trim(); if(!n) return; S.ratios[n]=[$("rP").value,$("rQ").value]; $("rName").value=""; refresh(); };
$("side").addEventListener("click", e=>{ const d=e.target.dataset; if(d.seg) delete S.segments[d.seg]; else if(d.rat) delete S.ratios[d.rat];
  else if(d.pt){ delete S.landmarks[d.pt]; probePts=probePts.filter(p=>p!==d.pt); } else return; refresh(); });

$("fImg").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const im=new Image();
  im.onload=()=>{ img=im; S.image=S.image||f.name; S.size=[im.width,im.height]; fit(); refresh(); }; im.src=URL.createObjectURL(f); };
$("fJson").onchange=e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(t=>{ const j=JSON.parse(t);
  S=Object.assign(blank(), j); delete S.computed; probePts=[]; refresh(); }); };
$("bSave").onclick=()=>{ const name=(S.image||"sheet").replace(/\.[^.]+$/,"")+".measure.json";
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:"application/json"}));
  a.download=name; a.click(); };
$("iName").value="head_top"; refresh();
</script>
</body>
</html>
